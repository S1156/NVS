<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorio Rezepte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylung/style.css">
</head>

<body>
    <input type="checkbox" id="theme-switch" class="theme-checkbox">

    <header class="main-header sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="index.htm">Factorio-Wiki</a>

                <div class="d-flex align-items-center">
                    <label for="theme-switch" class="theme-label me-2">
                        🌓 Modus
                    </label>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.htm">Wiki</a></li>
                        <li class="nav-item"><a class="nav-link" href="quiz.html">Quiz</a></li>
                        <li class="nav-item"><a class="nav-link active" href="recipes.html">Rezepte</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="text-center mb-2" style="color: var(--factorio-orange)">Crafting-Rezepte</h1>
        <p class="text-center mb-4">Übersicht der wichtigsten Rezepte in Factorio</p>

        <div class="d-flex flex-wrap gap-2 justify-content-center mb-3" id="filter-buttons">
            <button class="btn btn-warning fw-bold active-filter" data-cat="Alle">Alle</button>
            <button class="btn btn-outline-warning" data-cat="Zwischenprodukte">Zwischenprodukte</button>
            <button class="btn btn-outline-warning" data-cat="Militär">Militär</button>
            <button class="btn btn-outline-warning" data-cat="Produktion">Produktion</button>
            <button class="btn btn-outline-warning" data-cat="Logistik">Logistik</button>
        </div>

        <div class="mx-auto mb-4" style="max-width: 400px;">
            <input type="text" id="search-input" class="form-control custom-input" placeholder="Rezept suchen...">
        </div>

        <div id="recipe-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        </div>
    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2026 Factorio-Wiki für die Schule</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/recipes.js"></script>
</body>

</html>
