<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorio Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylung/style.css">
</head>

<body>
    <input type="checkbox" id="theme-switch" class="theme-checkbox">

    <header class="main-header sticky-top">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="index.htm">Factorio-Wiki</a>

                <div class="d-flex align-items-center">
                    <label for="theme-switch" class="theme-label me-2">
                        🌓 Modus
                    </label>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.htm">Wiki</a></li>
                        <li class="nav-item"><a class="nav-link active" href="quiz.html">Quiz</a></li>
                        <li class="nav-item"><a class="nav-link" href="recipes.html">Rezepte</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1 class="text-center mb-2" style="color: var(--factorio-orange)">Factorio Quiz</h1>
        <p class="text-center mb-4">Teste dein Wissen über Videospiele!</p>

        <div id="quiz-container" class="mx-auto" style="max-width: 700px;">
            <div class="card card-custom p-4 text-center">
                <h2 class="mb-3">Bereit zum Spielen?</h2>
                <p class="mb-4">10 Fragen aus der Kategorie Videospiele warten auf dich.</p>
                <button id="start-btn" class="btn btn-warning fw-bold py-2 px-5">
                    Quiz starten
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center py-4">
        <p class="mb-0">&copy; 2026 Factorio-Wiki für die Schule</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/quiz.js"></script>

</html>
